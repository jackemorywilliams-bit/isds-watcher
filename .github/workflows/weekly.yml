name: weekly-isds-watch

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch:        # manual trigger
    inputs:
      since:
        description: "Look-back window (e.g. 7d, 30d, 365d)"
        required: false
        default: "7d"

permissions:
  contents: write           # commit state + digests back

concurrency:
  group: isds-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      # Google Scholar via Gmail/IMAP — optional; absent = source stays inactive.
      GMAIL_ALERT_USER: ${{ secrets.GMAIL_ALERT_USER }}
      GMAIL_ALERT_PASS: ${{ secrets.GMAIL_ALERT_PASS }}
      GMAIL_ALERT_LABEL: ${{ vars.GMAIL_ALERT_LABEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast on missing secrets
        run: |
          missing=""
          [ -z "$SMTP_USER" ] && missing="$missing SMTP_USER"
          [ -z "$SMTP_PASS" ] && missing="$missing SMTP_PASS"
          if [ "$MODEL_PROVIDER" = "claude" ] || [ "$MODEL_PROVIDER" = "anthropic" ]; then
            [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          else
            [ -z "$GEMINI_API_KEY" ] && missing="$missing GEMINI_API_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          echo "Secrets present. Provider: ${MODEL_PROVIDER:-gemini}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run watcher
        run: python -m src.main --since "${{ github.event.inputs.since || '7d' }}"

      - name: Analytics — source receptivity
        run: python scripts/source_analytics.py

      - name: Rebuild website
        run: python scripts/build_site.py

      - name: Validate archive integrity
        # Fails the run (and fires the failure alert) if any digest breaks the
        # floor, ships a placeholder title, or has counts that disagree across
        # meta.json / article files / email footer.
        run: python scripts/validate_archive.py

      - name: Commit state + digests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ digests/ docs/ briefs/ analytics/
          if git diff --cached --quiet; then
            echo "No state/digest changes to commit."
          else
            git commit -m "chore: weekly digest + state update [skip ci]"
            # Rebase onto any changes pushed since checkout, then push, so a
            # concurrent commit can't fail the run on a non-fast-forward.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt failed; retrying"
              sleep 3
            done
          fi

      - name: Notify on failure
        if: failure()
        run: |
          python - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          host=os.environ.get("SMTP_HOST","smtp.gmail.com"); port=int(os.environ.get("SMTP_PORT","465"))
          user=os.environ.get("SMTP_USER"); pw=(os.environ.get("SMTP_PASS") or "").replace(" ","")
          if not (user and pw):
              print("no SMTP creds; cannot send failure alert"); raise SystemExit(0)
          run_url=f"{os.environ.get('GITHUB_SERVER_URL','https://github.com')}/{os.environ.get('GITHUB_REPOSITORY','')}/actions/runs/{os.environ.get('GITHUB_RUN_ID','')}"
          body=f"The weekly ISDS Thematic Watcher run FAILED.\n\nRun: {run_url}\n\nCheck the logs; the digest email may not have been sent."
          msg=MIMEText(body); msg["Subject"]="ISDS Thematic Watch — RUN FAILED"; msg["From"]=user; msg["To"]="jackemorywilliams@icloud.com"
          with smtplib.SMTP_SSL(host, port, timeout=30) as s:
              s.login(user, pw); s.sendmail(user, ["jackemorywilliams@icloud.com"], msg.as_string())
          print("failure alert sent")
          PY
