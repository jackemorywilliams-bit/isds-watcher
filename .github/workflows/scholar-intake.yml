name: scholar-intake

# Daily Google Scholar intake. Scholar alert emails arrive around 05:00 UTC;
# until 2026-09-08 only Monday's weekly run read them, so a Tuesday alert sat
# unseen for six days. This captures every alerted paper into the retry queue
# the morning it lands and records what the mailbox holds
# (analytics/scholar-intake/<date>.json). The weekly run classifies the queue
# first, so nothing captured here is lost to its window.
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC daily, after Scholar's send
  workflow_dispatch:
    inputs:
      days:
        description: "Alert window in days"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: isds-watcher         # never race the weekly run for state/
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    env:
      GMAIL_ALERT_USER: ${{ secrets.GMAIL_ALERT_USER }}
      GMAIL_ALERT_PASS: ${{ secrets.GMAIL_ALERT_PASS }}
      GMAIL_ALERT_LABEL: ${{ vars.GMAIL_ALERT_LABEL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: The intake's own tests
        run: python -m pytest tests/test_scholar_intake.py -q
      - name: Read the mailbox and queue new papers
        run: python scripts/scholar_intake.py --days "${{ github.event.inputs.days || '3' }}"
      - name: Commit the queue + the day's mailbox record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/deferred.json analytics/scholar-intake/
          if git diff --cached --quiet; then
            echo "scholar-intake: nothing to commit"
            exit 0
          fi
          git commit -m "chore: scholar intake $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push attempt $attempt failed; retrying"
            sleep 3
          done
      - name: Notify on failure
        if: failure()
        run: |
          python - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          host=os.environ.get("SMTP_HOST","smtp.gmail.com"); port=int(os.environ.get("SMTP_PORT","465"))
          user=os.environ.get("SMTP_USER"); pw=(os.environ.get("SMTP_PASS") or "").replace(" ","")
          if not (user and pw):
              print("no SMTP creds; cannot send failure alert"); raise SystemExit(0)
          run_url=f"{os.environ.get('GITHUB_SERVER_URL','https://github.com')}/{os.environ.get('GITHUB_REPOSITORY','')}/actions/runs/{os.environ.get('GITHUB_RUN_ID','')}"
          body=f"The daily Google Scholar intake FAILED.\n\nRun: {run_url}\n\nAlerts are not being captured until this is fixed; Monday's weekly run still reads the last 7 days."
          msg=MIMEText(body); msg["Subject"]="ISDS Thematic Watch — SCHOLAR INTAKE FAILED"; msg["From"]=user; msg["To"]="jackemorywilliams@icloud.com"
          with smtplib.SMTP_SSL(host, port, timeout=30) as s:
              s.login(user, pw); s.sendmail(user, ["jackemorywilliams@icloud.com"], msg.as_string())
          print("failure alert sent")
          PY
