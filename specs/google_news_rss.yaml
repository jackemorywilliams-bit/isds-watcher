source: google_news_rss
type: rss
usable: true
priority: primary
base_url: "https://news.google.com/rss/search"
robots: "Google News RSS public feed endpoint (treat as allowed for RSS consumption)"
fetch:
  urls:
    - "https://news.google.com/rss/search?q=%22abuse%20of%20right%22%20investment%20arbitration&hl=en-US&gl=US&ceid=US:en"
    - "https://news.google.com/rss/search?q=%22denial%20of%20justice%22%20ICSID&hl=en-US&gl=US&ceid=US:en"
    - "https://news.google.com/rss/search?q=%22promise%20utility%20doctrine%22&hl=en-US&gl=US&ceid=US:en"
    - "https://news.google.com/rss/search?q=patent%20ISDS&hl=en-US&gl=US&ceid=US:en"
    - "https://news.google.com/rss/search?q=trademark%20BIT%20arbitration&hl=en-US&gl=US&ceid=US:en"
    - "https://news.google.com/rss/search?q=%22reasonably%20foreseeable%22%20treaty%20arbitration&hl=en-US&gl=US&ceid=US:en"
    - "https://news.google.com/rss/search?q=%22manifest%20arbitrariness%22%20investment%20tribunal&hl=en-US&gl=US&ceid=US:en"
    - "https://news.google.com/rss/search?q=plain%20packaging%20investment%20arbitration&hl=en-US&gl=US&ceid=US:en"
  notes: >
    Valid RSS 2.0 search feeds. Verified live on the "abuse of right" query: returned 10
    items with real titles, links, pubDates, descriptions and guids (e.g. "FET and Abuse of
    Rights in Private Law...", "Litigating Intellectual Property Rights in Investor-State
    Arbitration..."). Each query above is URL-encoded and ready to use. Up to ~100 items per
    feed; results are date-ordered and include older items, so filter by entry.published
    against last-run time for new-only watching.
parse:
  feed_entry_fields:
    title: "entry.title  # often suffixed with ' - <Source Name>'"
    link: "entry.link    # Google News redirect URL (news.google.com/rss/articles/...); resolve to publisher if needed"
    date: "entry.published  # RFC822 GMT, e.g. 'Wed, 05 Feb 2025 08:00:00 GMT'"
    summary: "entry.summary  # HTML snippet/description"
    id: "entry.id (guid) or entry.link"
  id_strategy: "entry.id/guid; or normalized entry.link. Link is a Google redirect, so use guid for dedupe."
fields_available: [title, url, date, summary]
warnings: >
    entry.link is a Google News redirect (base64-ish article URL under news.google.com),
    not the publisher URL — resolve/follow if the real source URL is required. Same article
    can appear across multiple query feeds -> dedupe by guid/title. Feeds include historical
    items (results from years past), so always filter by pubDate for new-item detection.
