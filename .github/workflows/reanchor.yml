name: reanchor

# Move the tracked notes' currency anchors to the PR's own tip, so a merge does
# not land on main with stale anchors and a red `currency` guard. This is
# machinery that runs on every PR to main, not a step a model must remember —
# which is the whole point, because for two years the anchor was moved by a seat
# that was TOLD to move it and got it wrong every generation.
#
# Honest limit, stated so nobody trusts more than it delivers: the daily council
# squash-merges its OWN pull request via `gh`, and does not wait for checks. This
# workflow commits the re-anchor to the PR head, but if the session merges before
# it lands, the merge is still stale. Two things cover that path and neither is
# this workflow: (1) the daily-council close-out runs `scripts/reanchor.py`
# itself, as a deterministic SCRIPT call (not hand-written anchors) — see
# prompts/daily_council_protocol.md; (2) the operator can make these checks
# REQUIRED on main, which blocks a squash-merge until this workflow's commit has
# landed and turned `currency` green. Recommended in the PR that adds this.
#
#   CORRECTED 2026-09-10, and the original form of this recommendation was
#   unsafe: `reanchor` MUST be made required ALONGSIDE `currency`, never
#   `currency` on its own. GitHub reports a job skipped by its own `if:` as
#   SUCCESS, and the `currency` job below is skipped BY DESIGN whenever
#   `reanchor` does not succeed. So `currency` required alone is fail-OPEN on
#   precisely the path where the anchors are least trustworthy — a failed
#   re-anchor would leave a green `currency` and an unblocked merge. Required
#   together, the failed `reanchor` blocks it. Found by the integrity officer
#   reviewing the change that created the dependency; nothing is pinned on main
#   today, so nothing is currently armed either way.
#
# For operator PRs — reviewed and awaited — this workflow is the primary mover.
#
# SECOND JOB, added 2026-09-10: the `currency` guard itself, moved here out of
# pipeline-guards.yml. It had been another workflow's job with no ordering
# relation to this one, so both started from the same push and the guard read the
# anchors while this workflow was still computing the commit that fixes them.
# Every council merge went red on `currency` and green again seconds later, and a
# red that is routinely false is a red nobody reads — one session "fixed" it by
# hand-writing an anchor, which is the failure mode this workflow exists to end.
# `needs: reanchor` makes the ordering a fact rather than a timing accident. The
# guard itself is unchanged: same scripts/check_currency.py, same four
# predicates, same check-run name `currency`.
#
# The commit is NOTES-ONLY by construction: scripts/reanchor.py writes to nothing
# but the tracked notes, and scripts/check_currency.py excludes a notes-only
# commit from drift as maintenance. It carries [skip ci] and is pushed with
# GITHUB_TOKEN, whose pushes do not trigger further workflow runs, so it cannot
# loop.

# INVARIANT, load-bearing since 2026-09-10: this workflow has NO `paths:` filter
# and must not acquire one. When the `currency` job moved here, its two
# path-filter entries in pipeline-guards.yml — scripts/check_currency.py and
# tests/test_check_currency.py — were deleted rather than carried over, and that
# was safe ONLY because an unfiltered workflow already runs on every PR. Add a
# `paths:` filter here and the checker's own tests silently stop running on
# changes to the checker, which is the one change most able to break it.
# tests/test_ci_wiring.py asserts the absence, so this comment cannot rot alone.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  # Added 2026-09-08. A PR opened by a workflow with the repo token (the cron's
  # `council: daily meeting` PRs, #149 that day) never fires pull_request
  # workflows, so it merged un-re-anchored and main's currency job went red at
  # the next guarded push until a human PR's re-anchor happened to land. Every
  # push to main now re-anchors main itself. Loop-safe: the re-anchor commit is
  # `[skip ci]`, and reanchor.py targets the newest NON-maintenance commit.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: reanchor-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  reanchor:
    # Same-repo only: a fork PR gets a read-only token and cannot push back.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The mover's own tests (a broken mover moves nothing, or the wrong thing)
        run: |
          pip install pytest
          python -m pytest tests/test_reanchor.py -q
      - name: Move each tracked note's anchor to HEAD
        run: python scripts/reanchor.py
      - name: Commit the notes-only re-anchor, if anything moved
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Anchors already current at HEAD; nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "chore(currency): re-anchor tracked notes to HEAD [skip ci]"
          for attempt in 1 2 3; do
            git push origin "HEAD:${BRANCH}" && exit 0
            echo "push attempt ${attempt} failed; rebasing and retrying"
            git pull --rebase origin "${BRANCH}" && sleep 2
          done
          echo "could not push the re-anchor after 3 attempts"; exit 1

  # The guard, behind the mover. Two halves of the `if` are load-bearing.
  #
  # `always()` is what lets this job run at all when the job above was SKIPPED — a
  # fork PR gets a read-only token, so `reanchor` steps aside rather than fail on a
  # push it cannot make. A fork PR's notes go stale exactly like anyone else's, so
  # the guard must still fire there; without `always()`, a skipped dependency skips
  # this job too and the guard would quietly vanish on the one path where nothing
  # else is watching.
  #
  # The result test is what keeps `always()` from ALSO running this job when
  # `reanchor` failed. There the anchors are in an unknown state, the PR is already
  # red for a reason a human has to read, and a currency verdict computed on top of
  # a failed re-anchor is noise dressed as a finding. Failure and cancellation are
  # the only other reachable results and both are excluded deliberately.
  currency:
    needs: reanchor
    if: >-
      always() &&
      (needs.reanchor.result == 'success' || needs.reanchor.result == 'skipped')
    runs-on: ubuntu-latest
    # Read-only. This job checks; it moves nothing. The workflow-level
    # `contents: write` exists for the push in the job above and is not wanted here.
    permissions:
      contents: read
    steps:
      # Two reasons this is not the default checkout.
      #
      # (1) HISTORY. check_currency.py resolves commit shas, walks merge-bases and
      #     asks whether a note's cited commit is an ancestor of HEAD. On the
      #     default shallow checkout every one of those questions gets the wrong
      #     answer, and the guard would fail for a reason that has nothing to do
      #     with the repository's contents.
      #
      # (2) THE RE-ANCHOR COMMIT. For a pull_request event the default checkout is
      #     the merge ref GitHub computed when the event fired, which does NOT
      #     contain the `[skip ci]` commit the job above just pushed. Ordering the
      #     jobs would fix nothing if this one then read the pre-re-anchor tree. So
      #     it checks out the head BRANCH BY NAME — the same ref the job above
      #     pushed to, resolved by the same expression — and fetches it fresh.
      #
      #     When `reanchor` was SKIPPED that branch lives in a fork and does not
      #     exist in this repository, so naming it would fail the checkout itself;
      #     and there is no re-anchor commit to wait for either. The ref falls back
      #     to '' there, which is actions/checkout's own default — the merge ref.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.reanchor.result == 'success' && (github.event.pull_request.head.ref || github.ref_name) || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytest

      - name: The checker's own tests
        run: python -m pytest tests/test_check_currency.py -q

      # The wiring's own tests — that this job exists here, ordered behind the
      # mover, with the expression and the checkout that make the ordering mean
      # something, and that this workflow still has no `paths:` filter. They run
      # in pipeline-guards' `suite` job as well; two independent homes on purpose,
      # because each of the two workflows can be skipped on a path the other
      # still covers. They are NOT in tests/test_reanchor.py: that file gates the
      # job above, and a failure there would skip this job — reported as Success.
      - name: The CI wiring's own tests
        run: python -m pytest tests/test_ci_wiring.py -q

      - name: A note may not claim to be current when git says it is not
        run: python scripts/check_currency.py
