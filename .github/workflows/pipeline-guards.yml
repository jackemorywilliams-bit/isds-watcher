name: pipeline-guards

# The guards that protect the RUN RECORD — what the pipeline writes about itself
# and about the items it retired — plus the two new closed-grammar guards.
#
# Every one of these existed as a script and was wired into nothing. A guard that
# only runs when someone remembers to run it is a guard that reports clean on the
# day it matters, and this repo has the receipts: italaw 403'd for four straight
# weeks while every digest called it healthy, because the check that would have
# noticed was a thing a person did.
#
#   check_telemetry_privacy.py  analytics/candidate_telemetry.jsonl must never
#                               accumulate candidate TEXT. It grows every run and
#                               nobody reads it, which is exactly the file that
#                               acquires a "title" field one debugging session.
#   check_seen_integrity.py     a seen entry is the decision never to look at an
#                               item again; it must say how the item ended, and
#                               every abandonment must be ledgered.
#   check_headline_lane.py      a constrained-lane record must be byte-identical
#                               to what its own slots render, and must reach no
#                               conclusion about an item nobody read.
#   check_lock.py               the locked validation set must still be what it
#                               was when its hash was written down. Passes while
#                               the set is deliberately empty.
#
# NOT HERE ANY MORE. The `currency` guard was a second job in this file until
# 2026-09-10. It moved to .github/workflows/reanchor.yml, where it runs behind
# `needs: reanchor`, because the two workflows started from the same push with no
# ordering between them: this file's job read the anchors while reanchor.yml was
# still computing the commit that fixes them, so every council merge went red and
# green again seconds later. Its two path-filter entries went with it. The
# check-run is still named `currency`; the workflow reporting it is now `reanchor`.
#
# This follows the shape check_models.py, check_claims.py and check_marks.py
# already established: run the checker's OWN tests first — a broken checker
# reports clean — and then the checker.
#
# PATH FILTERS cover every file that can change the guarded schema or behaviour,
# not merely the guards themselves: the modules that WRITE the guarded records
# (src/telemetry.py, src/state.py, src/main.py, src/rings.py, src/headline_lane.py),
# the guards, and their tests. src/classify_v2.py and src/triage.py are included
# because both now write telemetry sections of their own.
#
# scripts/telemetry_query.py is deliberately NOT here. It is a reporting tool, not
# a guard: it has no failure mode that should stop a merge, and putting it in a
# gate would make a query bug look like an integrity violation.
on:
  pull_request:
    paths:
      - "src/telemetry.py"
      - "src/state.py"
      - "src/main.py"
      - "src/source_recovery.py"
      - "src/rings.py"
      - "src/classify.py"
      - "src/classify_v2.py"
      - "src/config.py"
      - "src/triage.py"
      - "src/headline_lane.py"
      - "agents/**"
      - "HANDOFF.md"
      - "STATE_OF_THE_ANSWER.md"
      - "scripts/check_telemetry_privacy.py"
      - "scripts/check_seen_integrity.py"
      - "scripts/check_headline_lane.py"
      - "scripts/check_lock.py"
      - "tests/test_telemetry.py"
      - "tests/test_pipeline.py"
      - "tests/test_source_recovery.py"
      - "tests/test_rings.py"
      - "tests/test_classify_v2.py"
      - "tests/test_triage.py"
      - "tests/test_headline_lane.py"
      - "tests/test_check_lock.py"
      - ".claude/agents/**"
      - "prompts/**"
      - "src/models.py"
      - "analytics/**"
      - "state/**"
      - "METHODOLOGY.md"
      - "lit-review/**"
      - "scripts/site_templates/**"
      - ".github/workflows/pipeline-guards.yml"
      # Added 2026-09-10 for the `suite` job, which is not a per-guard check and
      # therefore cannot be filtered per-guard. The narrow entries above are kept
      # deliberately: they are the documented statement of which files can change
      # which guarded SCHEMA, and deleting them because these subsume them would
      # delete that reasoning. These are a trigger, not a rationale.
      # `prompts/**` is already listed above and is not repeated.
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "requirements.txt"
      - "fingerprint.yaml"
      # And the workflows themselves, because tests/test_ci_wiring.py makes
      # assertions about reanchor.yml's shape. Without this, a PR editing only
      # reanchor.yml would run neither the suite nor any other check of it.
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "src/telemetry.py"
      - "src/state.py"
      - "src/main.py"
      - "src/source_recovery.py"
      - "src/rings.py"
      - "src/classify.py"
      - "src/classify_v2.py"
      - "src/config.py"
      - "src/triage.py"
      - "src/headline_lane.py"
      - "agents/**"
      - "HANDOFF.md"
      - "STATE_OF_THE_ANSWER.md"
      - "scripts/check_telemetry_privacy.py"
      - "scripts/check_seen_integrity.py"
      - "scripts/check_headline_lane.py"
      - "scripts/check_lock.py"
      - ".claude/agents/**"
      - "prompts/**"
      - "src/models.py"
      - "analytics/**"
      - "state/**"
      - "METHODOLOGY.md"
      - "lit-review/**"
      - "scripts/site_templates/**"
  workflow_dispatch:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The guards themselves are stdlib-only, but the planted-ledger tests in
      # tests/test_pipeline.py import src.main and with it the app's real
      # dependency chain (jinja2 via render, feedparser, requests) — pytest
      # collection alone needs them, so the job installs the requirements.
      - run: pip install -r requirements.txt pytest pyyaml

      # The checkers must themselves be checked — a broken checker reports clean.
      # Each of these files contains PLANTED violations: a text field smuggled
      # into telemetry, a seen entry with a non-terminal outcome, an abandonment
      # with no ledger line, a constrained-lane record edited away from its
      # slots, and a locked items.json changed after its hash was recorded.
      - name: The telemetry guard's own tests (planted text fields)
        run: python -m pytest tests/test_telemetry.py -q

      - name: The seen-state guard's own tests (planted missing ledger line)
        run: python -m pytest tests/test_pipeline.py -q -k "abandon or seen_integrity"

      - name: The constrained-lane guard's own tests (planted conclusions)
        run: python -m pytest tests/test_headline_lane.py -q

      - name: The lock guard's own tests (planted tamper)
        run: python -m pytest tests/test_check_lock.py -q

      # The ring contract and the two model paths that feed it. The enumeration
      # in test_rings.py is the closed statement that no state lets a MATCH out
      # the side; test_classify_v2.py is the closed statement that a lexical
      # derivation is never reported under a model's identity.
      - name: The ring contract and the V2/triage paths
        run: python -m pytest tests/test_rings.py tests/test_classify_v2.py tests/test_triage.py -q

      # Now the guards themselves, against the working tree.
      - name: Telemetry holds no candidate text
        run: python scripts/check_telemetry_privacy.py

      - name: Every seen entry accounts for its ending
        run: python scripts/check_seen_integrity.py

      - name: Every constrained-lane entry is exactly its own slots
        run: python scripts/check_headline_lane.py

      - name: Nothing locked has changed since it was locked
        run: python scripts/check_lock.py

  # THE WHOLE SUITE. Nothing in this repository ran it until 2026-09-10: every
  # pytest invocation in every workflow named specific files, and the job above
  # runs tests/test_pipeline.py under -k "abandon or seen_integrity". What that
  # cost was measured rather than guessed, and it is worse than "some tests are
  # slow to notice":
  #
  #   - src/source_recovery.py and tests/test_source_recovery.py have been in
  #     this file's path filters since they were written, and NO step runs that
  #     test file. The filter says the file matters and then nothing checks it.
  #   - src/source_health.py and tests/test_source_health.py are in neither the
  #     filters nor any step, in any workflow.
  #
  # So a test added to this repository was documentation unless someone thought
  # to wire it by name, and the wiring drifted from the filters without a sound.
  # This job is the backstop: it does not need to know which tests exist.
  #
  # Deliberately INDEPENDENT of `guards` — no `needs`. The named steps above
  # exist to say WHICH guard broke, in that guard's own words; a suite failure
  # must not queue behind them or be hidden by them. They run in parallel and
  # report separately.
  #
  # tests/test_one_pagers.py is excluded and must STAY excluded. It reads the
  # primary-source PDFs in seeds/, which is gitignored because third-party text
  # never enters this public repository (council standing rule, 2026-08-03).
  # Those files do not exist on a runner, so the exclusion is a fact about the
  # repository's publication rules, not a tolerated failure.
  suite:
    runs-on: ubuntu-latest
    steps:
      # Full history, and not for the reason the currency guard needs it. Three
      # tests in tests/test_check_currency.py reach for real history
      # (`HEAD~5`, a scan for a notes-only commit) and are written to RETURN
      # QUIETLY when they cannot find it. On a shallow checkout they would pass
      # without asserting anything, which is the vacuous-pass failure mode that
      # file's own test_the_guard_checks_something exists to forbid. The pack is
      # under 10 MiB over 1,135 commits, so depth 0 costs about a second.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pyyaml

      - name: The whole suite, not a named subset
        run: python -m pytest tests -q --ignore=tests/test_one_pagers.py
