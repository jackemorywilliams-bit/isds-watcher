version: 1
# The digest threshold. An item at or above it is reported as a MATCH, with no upper
# cap on how many. Lowered from 60 to 40 to broaden recall (more inclusive matching).
# There is NO non-empty-digest guarantee. By design, items BELOW this gate but at
# or above RELEVANCE_FLOOR (src/config.py) could be surfaced as watch-list LEADS —
# never as matches — up to MIN_DIGEST_ITEMS; since 2026-08-08/09 that fill is
# suspended (FILL_FLOOR_SUSPENDED) and all publication is gated at any score
# (VALIDATION_STATUS_ONLY) pending validation. A week in which
# nothing reaches the relevance floor produces an empty digest, and the digest says
# so plainly along with the number of candidates screened. The selection rule itself
# is src/main.py's select_surfaced(); this line is the value it gates on.
threshold: 40
scoring:
  high: 70
  medium: 40
  low: 0

# Three rings. Their INTERSECTION is the theme. Within-ring keyword weights
# sum to exactly 100 per ring. Phrases are extracted verbatim from the three
# seed awards (see PLAN.md "Thematic fingerprint" section); seed tags:
#   eli_lilly = Eli Lilly v Canada
#   philip_morris = Philip Morris v Australia
#   bridgestone = Bridgestone v Panama
# A few phrases are flagged theme_extension (same doctrinal family, not literal
# in the seeds) and carry deliberately small weights.
rings:

  ip_as_investment:
    weight: 100
    extra_weight: false
    keywords:
      - {phrase: "promise utility doctrine", weight: 8, seed: eli_lilly}
      - {phrase: "promise doctrine", weight: 3, seed: eli_lilly}
      - {phrase: "utility requirement", weight: 6, seed: eli_lilly}
      - {phrase: "patent invalidation", weight: 4, seed: eli_lilly}
      - {phrase: "covered investment", weight: 8, seed: "philip_morris,bridgestone"}
      - {phrase: "intellectual property", weight: 4, seed: bridgestone}
      - {phrase: "trademark", weight: 6, seed: bridgestone}
      - {phrase: "exploitation of the trademark", weight: 3, seed: bridgestone}
      - {phrase: "licenses that constitute its investment", weight: 4, seed: bridgestone}
      - {phrase: "licensor", weight: 4, seed: bridgestone}
      - {phrase: "licensee", weight: 4, seed: bridgestone}
      - {phrase: "brand value", weight: 2, seed: theme_extension}
      - {phrase: "geographical indication", weight: 3, seed: theme_extension}
      - {phrase: "data exclusivity", weight: 6, seed: "kim,ferguson"}
      - {phrase: "copyright", weight: 1, seed: theme_extension}
      # Trade-secret / clinical-data branch, from the Ferguson & Kim seed memos:
      - {phrase: "trade secret", weight: 9, seed: "ferguson,kim"}
      - {phrase: "clinical trial data", weight: 8, seed: kim}
      - {phrase: "test data", weight: 3, seed: kim}
      - {phrase: "unfair commercial use", weight: 5, seed: "ferguson,kim"}
      # TRIPS Article 39(3) hinge from the Ferguson & Kim memos (IP-specific). "indirect
      # expropriation" is deliberately NOT a Ring-1 phrase: it fires on non-IP cases (e.g.
      # sovereign-debt claims), so it lives in the doctrinal stakes, not the lexicon.
      - {phrase: "trips article 39", weight: 4, seed: "ferguson,kim"}
      - {phrase: "regulatory data protection", weight: 3, seed: theme_extension}
      - {phrase: "undisclosed test or other data", weight: 2, seed: theme_extension}
    # sum: 100 (trips-article-39 +2 offset by copyright -2)

  judicial_or_regulatory_measure:
    weight: 100
    extra_weight: true        # this ring alone, at the floor of 12 -> >= MEDIUM (45)
    keywords:
      - {phrase: "denial of justice", weight: 14, seed: "eli_lilly,bridgestone"}
      - {phrase: "judicial measure", weight: 8, seed: eli_lilly}
      - {phrase: "domestic court", weight: 7, seed: eli_lilly}
      - {phrase: "Supreme Court", weight: 7, seed: bridgestone}
      - {phrase: "judicial conduct", weight: 6, seed: eli_lilly}
      - {phrase: "judicial propriety", weight: 6, seed: "eli_lilly,bridgestone"}
      - {phrase: "manifestly unjust judgment", weight: 6, seed: bridgestone}
      - {phrase: "shocks a sense of judicial propriety", weight: 5, seed: bridgestone}
      - {phrase: "egregiously wrong that no honest or competent court could", weight: 5, seed: bridgestone}
      - {phrase: "systemic failure in the administration of justice", weight: 4, seed: bridgestone}
      - {phrase: "gross denial of justice, manifest arbitrariness, blatant unfairness", weight: 5, seed: eli_lilly}
      - {phrase: "minimum standard of treatment", weight: 6, seed: "eli_lilly,bridgestone"}
      - {phrase: "manifest arbitrariness", weight: 5, seed: eli_lilly}
      - {phrase: "arbitrary or discriminatory", weight: 5, seed: eli_lilly}
      - {phrase: "Plain Packaging Measures", weight: 4, seed: philip_morris}
      - {phrase: "public-interest legislation", weight: 4, seed: philip_morris}
      - {phrase: "dramatic change in the utility requirement", weight: 3, seed: eli_lilly}
    # sum: 14+8+7+7+6+6+6+5+5+4+5+6+5+5+4+4+3 = 100

  jurisdictional_admissibility:
    weight: 100
    extra_weight: false
    keywords:
      - {phrase: "abuse of right", weight: 12, seed: philip_morris}
      - {phrase: "abuse of process", weight: 9, seed: philip_morris}
      - {phrase: "treaty shopping", weight: 9, seed: philip_morris}
      - {phrase: "corporate restructuring", weight: 8, seed: philip_morris}
      - {phrase: "restructure its investment to gain Treaty protection", weight: 8, seed: philip_morris}
      - {phrase: "reasonably foreseeable", weight: 7, seed: philip_morris}
      - {phrase: "pre-existing or reasonably foreseeable dispute", weight: 7, seed: philip_morris}
      - {phrase: "critical date", weight: 6, seed: philip_morris}
      - {phrase: "treaty protection", weight: 5, seed: philip_morris}
      - {phrase: "shell subsidiary", weight: 6, seed: bridgestone}
      - {phrase: "abusive tactics", weight: 4, seed: bridgestone}
      - {phrase: "definition of investor", weight: 5, seed: bridgestone}
      - {phrase: "standing of licensor vs licensee", weight: 4, seed: bridgestone}
      - {phrase: "standing to claim denial of justice when not a party", weight: 4, seed: bridgestone}
      - {phrase: "exhaustion of local remedies", weight: 3, seed: bridgestone}
      - {phrase: "denial of benefits", weight: 2, seed: theme_extension}
      - {phrase: "substantial business activities", weight: 1, seed: theme_extension}
    # sum: 12+9+9+8+8+7+7+6+5+6+4+5+4+4+3+2+1 = 100

# DESCRIPTIVE ONLY — nothing in the codebase reads these strings. src/classify.py is
# the authority for every boundary stated here (keyword_score, and the constants
# PRESENT_FLOOR = 12 and STRONG_SUBTOTAL = 18). This block exists so a reader can see
# the grammar without reading the scorer; scripts/check_claims.py fails the build if
# the two disagree. Before 2026-08-04 these rules described a "subtotal >= 30" bar
# that appears nowhere in the code and had never changed a score.
combination_rules:
  - "a ring counts as PRESENT once its keyword subtotal reaches the present floor (12); below that it is an incidental brush, not a ring"
  - "two or more PRESENT rings -> HIGH: 70 + (sum of those rings' subtotals // 12), capped at 95"
  - "judicial_or_regulatory_measure PRESENT and the only present ring -> MEDIUM (45-69), earned at the floor of 12 and not at any higher bar — this is what extra_weight means"
  - "one other ring PRESENT and alone -> MEDIUM (40-66) if either its subtotal reaches the strong-single-ring floor (18) OR any second ring has a nonzero hit, however small"
  - "one other ring PRESENT and alone, below 18 and with no second-ring hit at all -> LOW (28-33)"
  - "no ring reaches the floor -> LOW, roughly the largest ring subtotal, capped at 39"
  - "negative_signals present and neither ip_as_investment nor judicial_or_regulatory_measure is PRESENT -> score capped at 35 (LOW); a sub-floor brush does not rescue"
# Worked boundaries, measured against the live scorer on 2026-08-04:
#   one ring at 12, no second ring                     -> 28  (LOW)
#   one ring at 12 + a single 1-point brush elsewhere  -> 41  (MEDIUM — a digest match)
#   one ring at 18, no second ring                     -> 40  (MEDIUM)
#   judicial_or_regulatory_measure alone at 12         -> 45  (MEDIUM)

negative_signals:           # push toward LOW unless a ring rescues
  - "mining / oil / gas / mineral concession"
  - "sovereign debt / bond / restructuring of sovereign debt"
  - "intra-EU energy / Energy Charter Treaty solar / feed-in tariff"
  - "vanilla direct expropriation with no IP and no judicial measure"
  - "tax assessment dispute with no judicial-conduct or IP angle"

# The labelled gold set for the DETERMINISTIC scorer. (The LLM's few-shot examples are
# separate and live in prompts/classifier.txt; nothing renders these into a prompt.) Its
# only consumer is tests/test_pipeline.py.
#
# expected_score, matched_rings and touched_rings are RECORDS OF WHAT
# src.classify.keyword_score RETURNS on each summary — measured, not aspired to. Until
# 2026-08-04 all seven scores were wrong (they read 88/84/58/52/12/8/10 against actual
# 73/75/40/56/7/0/7) and four ring lists were wrong, because the test asserted only
# expected_band and nothing ever read the other two fields. They are asserted now, so a
# lexicon re-weighting must re-measure this set deliberately instead of silently
# invalidating it.
#
# matched_rings AND touched_rings, AND WHY THERE ARE NOW TWO (SD-3, 2026-09-10).
#
#   matched_rings  rings at or above the present floor (12). THE PREDICATE — the set
#                  the combination rules above actually score from, and, since SD-3,
#                  the set the "Keyword-matched rings" label reports.
#   touched_rings  rings with any nonzero subtotal, sub-floor brushes included. THE
#                  WORKING DETAIL. matched_rings is always a subset of it.
#
# WHAT THIS NOTE SAID BEFORE, AND WHY IT NO LONGER SAYS IT. Until 2026-09-10
# keyword_score returned the BROAD set under the name matched_rings, so the published
# predicate was looser than the one the scoring grammar used — the mining and solar
# examples, which engage no ring substantively and score 7, listed rings anyway. This
# note recorded that on 2026-08-04 rather than correcting it, on the stated ground that
# "the digest archive was published under this predicate."
#
# THAT GROUND HAS EXPIRED, which is why the correction lands now and not then. All
# sixteen archived runs ran `classifier: claude`; every one of the 17 published ring
# labels came from the LLM path; and the string "Keyword-matched rings:" appears in zero
# published files. Nothing was ever published under the loose predicate, so nothing is
# restated by narrowing it. Three of the seven ring lists below changed on re-measurement
# (examples 4, 5 and 7); NO SCORE AND NO BAND CHANGED, because present_rings was already
# the only set the scoring rules read. The sub-floor brushes that used to be the whole
# content of those three lists are not lost — they are in touched_rings, where they can
# still be read as evidence for a re-weighting.
few_shot_examples:
  - title: "Pharma claimant challenges patent invalidation under heightened utility test"
    summary: >
      A multinational pharmaceutical company brings a NAFTA/USMCA claim after its
      drug patents are invalidated by domestic courts applying a newly raised
      "promise utility" / utility-requirement standard, framing the patents as a
      covered investment and the court rulings as a judicial measure amounting to
      denial of justice and a breach of the minimum standard of treatment.
    expected_band: HIGH
    expected_score: 73
    matched_rings: [ip_as_investment, judicial_or_regulatory_measure]
    touched_rings: [ip_as_investment, judicial_or_regulatory_measure]
    why: "IP-as-investment (patent/utility requirement) intersects a judicial-measure denial-of-justice claim — two rings, both at or above the floor (12 and 35). Matched and touched coincide: nothing here is a brush."

  - title: "Trademark licensor/licensee restructures into BIT-state shell after adverse Supreme Court ruling"
    summary: >
      A brand owner splits trademark ownership between a licensor and an in-country
      licensee and channels the holding through a shell subsidiary in a treaty state
      to manufacture standing, then claims the host Supreme Court's manifestly unjust
      judgment denied justice. Respondent pleads abuse of process, treaty shopping,
      and that the licensor lacks standing to claim denial of justice when not a party.
    expected_band: HIGH
    expected_score: 75
    matched_rings: [ip_as_investment, judicial_or_regulatory_measure, jurisdictional_admissibility]
    touched_rings: [ip_as_investment, judicial_or_regulatory_measure, jurisdictional_admissibility]
    why: "Trademark/licenses as investment + shell-subsidiary treaty-shopping jurisdiction fight + Supreme Court judgment — three rings, at 14, 27 and 28. The only example in the set where all three clear the floor."

  - title: "Data-exclusivity and GI dispute over generics regulation"
    summary: >
      An originator pharma company alleges that a host state's regulation eroding
      data exclusivity and cancelling a geographical indication destroyed brand value
      protected as a covered investment, tying the regulatory measure loosely to a
      single first-instance court decision it disputes.
    expected_band: MEDIUM
    expected_score: 40
    matched_rings: [ip_as_investment]
    touched_rings: [ip_as_investment]
    why: "IP-as-investment alone (19) above the strong-single-ring floor (18). The regulatory/judicial tie is written in prose the lexicon does not carry, so Ring 2 scores nothing at all — not even a brush, which is why touched adds nothing. Lands on exactly 40, the lowest MEDIUM there is."

  - title: "Copyright-levy claimant challenges a Supreme Court ruling as denial of justice"
    summary: >
      A collecting society's investor challenges a host-state Supreme Court judgment
      that struck down private-copying copyright levies, alleging the ruling was
      egregiously wrong such that no honest or competent court could have reached it,
      amounting to a gross denial of justice and breach of the minimum standard of
      treatment. No jurisdictional restructuring is alleged.
    expected_band: MEDIUM
    expected_score: 56
    matched_rings: [judicial_or_regulatory_measure]
    touched_rings: [ip_as_investment, judicial_or_regulatory_measure]
    why: "Judicial-measure case alone (Supreme Court judgment, denial of justice) at 27 -> MEDIUM via Ring 2 extra weight. Ring 1 scores 1 — a single brush on \"copyright\" — so it is TOUCHED and not MATCHED. Re-measured under SD-3 on 2026-09-10: the old list named both rings, which read as a two-ring case beside a one-ring score."

  - title: "Investor sues over revoked copper mining concession (direct expropriation)"
    summary: >
      A mining company claims the host state directly expropriated its copper mineral
      concession by executive decree, seeking compensation. No intellectual property,
      no domestic court judgment, and no jurisdictional/abuse-of-right issue is involved.
    expected_band: LOW
    expected_score: 7
    matched_rings: []
    touched_rings: [ip_as_investment, judicial_or_regulatory_measure]
    why: "Vanilla mining/mineral-concession expropriation; negative signal, no ring rescues. NO ring reaches the floor: the two touched are sub-floor brushes at 4 and 7 (\"intellectual property\", \"domestic court\" — both in the sentence DENYING them), which is why the score is 7 and not a MEDIUM. Re-measured under SD-3 on 2026-09-10: this is the example the old predicate misreported worst, listing two rings for a text whose only mention of either is a denial."

  - title: "Bondholder claim over sovereign debt restructuring"
    summary: >
      Foreign holders of government bonds bring a claim challenging a sovereign debt
      restructuring and haircut as an indirect expropriation and unfair treatment.
      Purely financial; no IP and no judicial-conduct measure.
    expected_band: LOW
    expected_score: 0
    matched_rings: []
    touched_rings: []
    why: "Sovereign debt/bond negative signal with no IP and no judicial measure -> forced LOW. Nothing in the lexicon fires at all, so the score is 0 and both lists are empty — the only example where \"no ring was anywhere near this\" is the literal truth."

  - title: "Solar investor claims under the Energy Charter Treaty over feed-in tariff cuts"
    summary: >
      An intra-EU solar investor claims that retroactive cuts to renewable feed-in
      tariffs breached the Energy Charter Treaty's fair-and-equitable-treatment
      standard. No IP-as-investment angle and no domestic court judgment is challenged.
    expected_band: LOW
    expected_score: 7
    matched_rings: []
    touched_rings: [judicial_or_regulatory_measure]
    why: "Intra-EU energy / ECT solar negative signal; no ring PRESENT. Ring 2 is TOUCHED at 7 on a sub-floor brush (\"domestic court\", in the clause saying none is challenged) and is no longer MATCHED. Re-measured under SD-3 on 2026-09-10."
