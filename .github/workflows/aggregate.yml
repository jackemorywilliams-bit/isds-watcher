name: aggregate-digest

# Manual: emails one aggregated digest of every genuinely-relevant article
# surfaced across all archived runs (the running collective total).
on:
  workflow_dispatch: {}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send aggregated digest
        run: python scripts/send_aggregate.py
